openapi: 3.0.3
info:
  description: "API for managing users, including creating, updating, deleting and\
    \ manage. The API allows users to manage an user. The user must be authenticated\
    \ to access these endpoints. The systems saves ids but when the user interacts\
    \ with the API, they work with the actual data rather than the IDs."
  title: Users API
  version: 1.0.0
servers:
- description: Local development server for API testing and development.
  url: http://localhost:8083
- description: "Production server until a custom domain is available; currently, localhost\
    \ until Practice 3"
  url: https://localhost:8084
tags:
- description: Operations related to user management.
  name: Users
- description: Operations related to user authentication.
  name: Authentication
- description: Operations related to budget management.
  name: Budget
- description: Operations related to group management.
  name: Groups
paths:
  /users:
    delete:
      description: Delete an user by their unique ID. The user will be removed from
        the system. The user must be authenticated to perform this action. The group
        'ADMIN' can delete any user.
      operationId: deleteUser
      parameters:
      - description: The ID of the user.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                message: User deleted successfully.
                code: 200
              schema:
                $ref: "#/components/schemas/Success"
          description: User deleted successfully.
        "401":
          content:
            application/json:
              example:
                message: Unauthorized.
                code: 401
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized. The request requires user authentication.
        "403":
          content:
            application/json:
              example:
                message: Forbidden.
                code: 403
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden. The user does not have the necessary permissions
            to access this endpoint.
        "404":
          content:
            application/json:
              example:
                message: Not Found.
                code: 404
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found. The requested resource could not be found.
        "503":
          content:
            application/json:
              example:
                message: Service unavailable.
                code: 503
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable. The server is currently unable to handle
            the request.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error.
                code: 500
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error. An unexpected error occurred on the
            server.
      summary: Delete a user.
      tags:
      - Users
      x-accepts:
      - application/json
    get:
      description: Retrieve a list of all users. Only administrators have access to
        this endpoint. This endpoint requires the user to be authenticated. List all
        the users in the system.
      operationId: getUsers
      responses:
        "200":
          content:
            application/json:
              example:
              - id: 123e4567-e89b-12d3-a456-426614174000
                name: John
                email: john.doe@example.com
                surname: Doe
                creationDate: 2024-06-05T12:00:00Z
              schema:
                items:
                  $ref: "#/components/schemas/User"
                type: array
          description: Successful operation. Returns a list of users.
        "401":
          content:
            application/json:
              example:
                message: Unauthorized.
                code: 401
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized. The request requires user authentication.
        "403":
          content:
            application/json:
              example:
                message: Forbidden.
                code: 403
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden. The user does not have the necessary permissions
            to access this endpoint.
        "404":
          content:
            application/json:
              example:
                message: Not Found.
                code: 404
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found. The requested resource could not be found.
        "503":
          content:
            application/json:
              example:
                message: Service unavailable.
                code: 503
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable. The server is currently unable to handle
            the request.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error.
                code: 500
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error. An unexpected error occurred on the
            server.
      summary: Retrieve a list of users
      tags:
      - Users
      x-accepts:
      - application/json
    post:
      description: |
        Endpoint to create a new user. The request body must include the user's name, email, and password.
      operationId: CreateUser
      requestBody:
        content:
          application/json:
            example:
              name: John
              email: john.doe@example.com
              surname: Doe
              group: USER
              creationDate: 2024-06-05T12:00:00Z
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                name: John
                email: john.doe@example.com
                surname: Doe
                creationDate: 2024-06-05T12:00:00Z
              schema:
                $ref: "#/components/schemas/User"
          description: Successfull operation. User created
        "400":
          content:
            application/json:
              example:
                message: Incorrect datas.
                code: 400
              schema:
                $ref: "#/components/schemas/Error"
          description: Incorrect datas
        "409":
          content:
            application/json:
              example:
                message: The email is already register!
                code: 409
              schema:
                $ref: "#/components/schemas/Error"
          description: The email is already register.
        "500":
          content:
            application/json:
              example:
                message: Internal server error.
                code: 500
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal server error. An unexpected error occurred on the
            server.
        "503":
          content:
            application/json:
              example:
                message: Service unavailable.
                code: 503
              schema:
                $ref: "#/components/schemas/Error"
          description: Service unavailable. The server is currently unable to handle
            the request due to temporary overload or maintenance.
      summary: Create a new user
      tags:
      - Users
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: Update an existing user's information. Only users with appropriate
        permissions can access this endpoint. The user authentication and authorization
        are required to access this endpoint. The user authenticated and authorized
        will be able to update their information.
      parameters:
      - description: The ID of the user.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              name: John
              email: john.doe@example.com
              surname: Doe
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: 123e4567-e89b-12d3-a456-426614174000
                name: John
                email: john.doe@example.com
                surname: Doe
                creationDate: 2024-06-05T12:00:00Z
                group: ADMIN
              schema:
                $ref: "#/components/schemas/User"
          description: User updated successfully.
        "401":
          content:
            application/json:
              example:
                message: Unauthorized.
                code: 401
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized. The request requires user authentication.
        "403":
          content:
            application/json:
              example:
                message: Forbidden.
                code: 403
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden. The user does not have the necessary permissions
            to access this endpoint.
        "404":
          content:
            application/json:
              example:
                message: Not Found.
                code: 404
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found. The requested resource could not be found.
        "503":
          content:
            application/json:
              example:
                message: Service unavailable.
                code: 503
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable. The server is currently unable to handle
            the request.
        "500":
          content:
            application/json:
              example:
                message: Internal Server Error.
                code: 500
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error. An unexpected error occurred on the
            server.
      summary: Update an existing user.
      tags:
      - Users
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/profile:
    get:
      description: "Retrieve the profile information of the currently authenticated\
        \ user. The user must be authenticated to access this endpoint. The endpoint\
        \ will also communicate with the microservice Category to retrieve additional\
        \ user information. The system will call the endpoint GET -> /category to\
        \ obtain the necessary category details. Once the category information is\
