
services:
  postgres:
    image: postgres:17
    container_name: users-db-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_PASSWORD: Postgres12345
      POSTGRES_DB: users
      POSTGRES_USER: admin

    volumes:
      - "/Users/guadalupemarquezaguilar/Documents/Universidad/ASEE/ControlBills/Users/PostgreSQL:/var/lib/postgresql/data"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d users"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
    name: postgres_data